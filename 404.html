<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Get ExpiryPal</title>
  <meta property="og:title" content="ExpiryPal">
  <meta property="og:description" content="Scan expiry dates and get reminded before things go off.">
  <script>
    (function () {
      // Short creator links: expirypal.app/anna opens the smart link for "anna".
      // GitHub Pages serves this page for any path without a file of its own.
      var base = location.pathname.indexOf('/expirypal_docs/') === 0 ? '/expirypal_docs/' : '/';
      var rest = location.pathname.slice(base.length).replace(/\/+$/, '');
      if (/^[A-Za-z0-9_-]{1,40}$/.test(rest)) {
        location.replace(base + 'go/?c=' + encodeURIComponent(rest.toLowerCase()));
      }
    })();
  </script>

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      padding: 32px 20px 64px;
      line-height: 1.6;
    }
  </style>
</head>
