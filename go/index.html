<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:title" content="Get ExpiryPal">
  <meta property="og:description" content="Scan expiry dates and get reminded before things go off.">

  <meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)">

  <link rel="preload" href="/assets/fonts/PlusJakartaSans-ExtraBold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/assets/site.css?v=7">
  <meta name="robots" content="noindex">
  <style>
    .code-row { display: inline-flex; align-items: center; gap: 12px; }
    .copy-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 11px; border: 0; border-radius: 999px; background: var(--brand); color: var(--on-brand); font: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0; cursor: pointer; }
    .copy-btn svg { width: 16px; height: 16px; }
    .copy-btn.done { background: var(--brand-ink); }
  </style>
</head>
<body><header class="top"><div class="wrap"><a class="brand" href="/"><img src="/assets/icon-green.png" alt="">ExpiryPal</a><nav class="nav"><a href="/#how">How it works</a><a href="/#pricing">Pricing</a><a href="/#get">Support</a></nav><a class="btn sm" href="/#get">Get the app</a></div></header><main class="page"><div class="doc center-card"><img class="logo" src="/assets/icon-green.png" alt=""><h1>Get ExpiryPal</h1><p>Know before it expires. ExpiryPal reminds you before things run out.</p><p id="code-line" class="codebox" hidden><span id="code-label">Your promo code</span><span class="code-row"><b id="code"></b><button type="button" class="copy-btn" id="copy-code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span id="copy-label">Copy</span></button></span><span id="code-hint">Paste it when you first open ExpiryPal and get 30 days of Pro instead of 14.</span></p><p id="copy-wrap" hidden><a class="btn" id="copy-go" href="https://apps.apple.com/app/id6821722011">Copy code and open App Store</a></p><div class="stores"><a class="sbadge" id="app-store" href="https://apps.apple.com/app/id6821722011"><img src="/assets/badge-app-store.svg" alt="Download on the App Store" width="168" height="56"></a><a class="sbadge" id="play-store" href="https://play.google.com/store/apps/details?id=com.expirypal.app"><img src="/assets/badge-google-play.png" alt="Get it on Google Play" width="188" height="56"></a></div></div></main><footer><div class="wrap"><span>© 2026 ExpiryPal</span><div class="links"><a href="/privacy.html">Privacy</a><a href="mailto:expirypal.app@gmail.com">Contact</a></div></div></footer>
  <script>
    (function () {
      // App Store Connect > App Analytics > Campaigns > Generate a campaign link shows the provider token ("pt").
      var PROVIDER_TOKEN = '129595375';
      var APP_STORE_ID = '6821722011';
      var PLAY_PACKAGE = 'com.expirypal.app';

      var params = new URLSearchParams(window.location.search);
      // Apple allows up to 40 characters in a campaign token.
      var slug = (params.get('c') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40);

      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      // iPadOS reports a desktop Mac user agent, so touch support tells them apart.
      var isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

      function appStoreUrl(campaign) {
        var url = 'https://apps.apple.com/app/id' + APP_STORE_ID;
        if (campaign && PROVIDER_TOKEN) {
          url += '?pt=' + encodeURIComponent(PROVIDER_TOKEN) + '&ct=' + encodeURIComponent(campaign) + '&mt=8';
        }
        return url;
      }

      function playStoreUrl(campaign) {
        var url = 'https://play.google.com/store/apps/details?id=' + PLAY_PACKAGE;
        if (campaign) {
          var referrer = 'utm_source=' + campaign + '&utm_medium=influencer';
          url += '&referrer=' + encodeURIComponent(referrer);
        }
        return url;
      }

      function show(creator) {
        var campaign = creator ? creator.slug : '';
        var ios = appStoreUrl(campaign);
        var android = playStoreUrl(campaign);
        document.getElementById('app-store').href = ios;
        document.getElementById('play-store').href = android;
        if (creator && creator.code) {
          var code = creator.code;
          document.getElementById('code').textContent = code;
          document.getElementById('code-label').textContent = T.label;
          document.getElementById('code-hint').textContent = T.hint;
          document.getElementById('code-line').hidden = false;
          var copyBtn = document.getElementById('copy-code');
          var copyLabel = document.getElementById('copy-label');
          copyLabel.textContent = T.copy;
          copyBtn.setAttribute('aria-label', T.copy + ' ' + code);
          copyBtn.addEventListener('click', function () {
            copyText(code).then(function () {
              copyLabel.textContent = T.done + ' \u2713';
              copyBtn.classList.add('done');
              setTimeout(function () { copyLabel.textContent = T.copy; copyBtn.classList.remove('done'); }, 2000);
            });
          });
          // Any store tap copies the code, so the app can offer "Paste" on first launch.
          document.getElementById('app-store').addEventListener('click', function (e) { copyThenGo(e, code, ios); });
          document.getElementById('play-store').addEventListener('click', function (e) { copyThenGo(e, code, android); });
          if (isIOS) {
            // iPhone has no install referrer, so the clipboard carries the code. Copying needs a tap, so stay on the page.
            var go = document.getElementById('copy-go');
            go.href = ios;
            go.textContent = T.button;
            go.addEventListener('click', function (e) { copyThenGo(e, code, ios); });
            document.getElementById('copy-wrap').hidden = false;
            return;
          }
        }
        if (isIOS) {
          window.location.replace(ios);
        } else if (isAndroid) {
          window.location.replace(android);
        }
      }

      var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var T = {
        en: { title: 'Get ExpiryPal', sub: 'Know before it expires. ExpiryPal reminds you before things run out.', label: 'Your promo code', hint: 'Paste it when you first open ExpiryPal and get 30 days of Pro instead of 14.', button: 'Copy code and open App Store', copied: 'Code copied', copy: 'Copy', done: 'Copied' },
        sr: { title: 'Preuzmi ExpiryPal', sub: 'Saznaj pre nego što istekne. ExpiryPal te podseti na vreme.', label: 'Tvoj promo kod', hint: 'Nalepi ga kad prvi put otvoriš ExpiryPal i dobij 30 dana Pro-a umesto 14.', button: 'Kopiraj kod i otvori App Store', copied: 'Kod je kopiran', copy: 'Kopiraj', done: 'Kopirano' },
        ru: { title: 'Скачать ExpiryPal', sub: 'Узнай, пока не истекло. ExpiryPal напомнит вовремя.', label: 'Ваш промокод', hint: 'Вставьте его при первом запуске ExpiryPal и получите 30 дней Pro вместо 14.', button: 'Скопировать код и открыть App Store', copied: 'Код скопирован', copy: 'Копировать', done: 'Скопировано' }
      };
      T = T[lang] || (lang === 'hr' || lang === 'bs' || lang === 'me' ? T.sr : T.en);
      document.querySelector('.center-card h1').textContent = T.title;
      document.querySelector('.center-card h1 + p').textContent = T.sub;
      document.documentElement.lang = T.title === 'Get ExpiryPal' ? 'en' : (lang === 'ru' ? 'ru' : 'sr');

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(function () { legacyCopy(text); });
        }
        legacyCopy(text);
        return Promise.resolve();
      }
      function legacyCopy(text) {
        var input = document.createElement('input');
        input.value = text;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        input.setSelectionRange(0, text.length);
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(input);
      }
      // Copies inside the tap, then opens the store. Never waits more than a moment on the clipboard.
      function copyThenGo(e, text, url) {
        e.preventDefault();
        var go = document.getElementById('copy-go');
        var left = false;
        function leave() { if (!left) { left = true; window.location.href = url; } }
        copyText(text).then(function () {
          if (go) go.textContent = T.copied + ' \u2713';
          setTimeout(leave, 350);
        });
        setTimeout(leave, 1200);
      }

      var done = false;
      function finish(creator) {
        if (done) return;
        done = true;
        show(creator);
      }

      if (!slug) {
        finish(null);
        return;
      }
      // Never keep someone waiting on a slow list: after 2 seconds go to the store with the slug as given.
      setTimeout(function () { finish({ slug: slug }); }, 2000);
      fetch('../creators.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          var creators = (data && data.creators) || [];
          var match = creators.find(function (c) {
            return c && c.active !== false && String(c.slug).toLowerCase() === slug;
          });
          finish(match ? { slug: slug, code: match.code } : null);
        })
        .catch(function () { finish({ slug: slug }); });
    })();
  </script>
</body>
</html>
