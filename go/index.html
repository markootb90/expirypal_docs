<body><header class="top"><div class="wrap"><a class="brand" href="/"><img src="/assets/icon-green.png" alt="">ExpiryPal</a><nav class="nav"><a href="/#features">Features</a><a href="/#pro">Pro</a><a href="/#support">Support</a></nav><a class="btn sm" href="/#get">Get the app</a></div></header><main class="page"><div class="doc center-card"><img class="logo" src="/assets/icon-green.png" alt=""><h1>Get ExpiryPal</h1><p>Waste less. Save more. ExpiryPal reminds you before things run out.</p><p id="code-line" class="codebox" hidden>Your creator code<b id="code"></b><span>Enter it in the app under Settings &gt; Creator code.</span></p><div class="stores"><a class="store" id="app-store" href="https://apps.apple.com/app/id6821722011"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg><span><small>Download on the</small><b>App Store</b></span></a><a class="store" id="play-store" href="https://play.google.com/store/apps/details?id=com.expirypal.app"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3.5v17l14-8.5z"/></svg><span><small>Get it on</small><b>Google Play</b></span></a></div></div></main><footer><div class="wrap"><span>© 2026 ExpiryPal</span><div class="links"><a href="/privacy.html">Privacy</a><a href="mailto:expirypal.app@gmail.com">Contact</a></div></div></footer>
  <script>
    (function () {
      // App Store Connect > App Analytics > Campaigns > Generate a campaign link shows the provider token ("pt").
      var PROVIDER_TOKEN = '129595375';
      var APP_STORE_ID = '6821722011';
      var PLAY_PACKAGE = 'com.expirypal.app';

      var params = new URLSearchParams(window.location.search);
      // Apple allows up to 40 characters in a campaign token.
      var slug = (params.get('c') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40);

      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      // iPadOS reports a desktop Mac user agent, so touch support tells them apart.
      var isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

      function appStoreUrl(campaign) {
        var url = 'https://apps.apple.com/app/id' + APP_STORE_ID;
        if (campaign && PROVIDER_TOKEN) {
          url += '?pt=' + encodeURIComponent(PROVIDER_TOKEN) + '&ct=' + encodeURIComponent(campaign) + '&mt=8';
        }
        return url;
      }

      function playStoreUrl(campaign) {
        var url = 'https://play.google.com/store/apps/details?id=' + PLAY_PACKAGE;
        if (campaign) {
          var referrer = 'utm_source=' + campaign + '&utm_medium=influencer';
          url += '&referrer=' + encodeURIComponent(referrer);
        }
        return url;
      }

      function show(creator) {
        var campaign = creator ? creator.slug : '';
        var ios = appStoreUrl(campaign);
        var android = playStoreUrl(campaign);
        document.getElementById('app-store').href = ios;
        document.getElementById('play-store').href = android;
        if (creator && creator.code) {
          document.getElementById('code').textContent = creator.code;
          document.getElementById('code-line').hidden = false;
        }
        if (isIOS) {
          window.location.replace(ios);
        } else if (isAndroid) {
          window.location.replace(android);
        }
      }

      var done = false;
      function finish(creator) {
        if (done) return;
        done = true;
        show(creator);
      }

      if (!slug) {
        finish(null);
        return;
      }
      // Never keep someone waiting on a slow list: after 2 seconds go to the store with the slug as given.
      setTimeout(function () { finish({ slug: slug }); }, 2000);
      fetch('../creators.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          var creators = (data && data.creators) || [];
          var match = creators.find(function (c) {
            return c && c.active !== false && String(c.slug).toLowerCase() === slug;
          });
          finish(match ? { slug: slug, code: match.code } : null);
        })
        .catch(function () { finish({ slug: slug }); });
    })();
  </script>
</body>
</html>
